# Keep puzzly-api.onrender.com awake on Render free tier. Public URL only; no secrets.
name: Keep puzzly-api awake

on:
  schedule:
    - cron: '3,8,13,18,23,28,33,38,43,48,53,58 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping healthz
        run: |
          set -euo pipefail
          URL="https://puzzly-api.onrender.com/api/healthz"
          for i in 1 2 3 4 5; do
            echo "Attempt $i: GET $URL"
            if curl -fsS --max-time 60 -o /tmp/healthz.body -w "HTTP %{http_code} in %{time_total}s\n" "$URL"; then
              echo "Body:"; cat /tmp/healthz.body; echo
              exit 0
            fi
            echo "Attempt $i failed; sleeping 15s"
            sleep 15
          done
          echo "All attempts failed"
          exit 1
